name: Release

# Pushing a tag release-YYYY-MM-DD-HHMMSS builds every executable, checks
# the installer against them and creates a DRAFT GitHub release. A person
# reviews and publishes the draft. See docs/releasing.md.
on:
  push:
    tags: ["release-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and draft release
    runs-on: rzv-ubuntu-24.04-x64-2vcpu-8gb
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^release-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{6}$ ]] || { echo "Tag must look like release-YYYY-MM-DD-HHMMSS" >&2; exit 1; }
          grep -q "^## ${TAG} " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${TAG} ' section" >&2; exit 1; }

      - name: Test
        run: go vet ./... && go test -race -count=1 ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/build.sh "${RUNNER_TEMP}/dist" "$TAG"

      - name: Check the installer
        run: bash scripts/test-install.sh "${RUNNER_TEMP}/dist"

      - name: Create draft release
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-draft.sh "$TAG" "${RUNNER_TEMP}/dist"
